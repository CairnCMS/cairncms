# This compose file is meant to spin up a copy of all supported database vendors + Redis and S3 (S3Proxy).
# For production use, see the CairnCMS docs under Self-Hosted → Installation → Docker → Docker Compose.
#
# ONLY FOR DEBUGGING. THIS IS NOT INTENDED FOR PRODUCTION USE.
#
# Ports:
#   Postgres (18):   5100
#   MySQL (8.4):     5101
#   MariaDB (12.3):  5102
#   MS SQL:          5103
#   Oracle:          5104
#   Redis:           5105
#   S3Proxy (S3):    5106
#   Azure            5107
#   MySQL (9.7):     5108
#   Memcached:       5109
#   Keycloak:        5110
#   Postgres (15):   5111
#   MariaDB (10.11): 5112
#   CockroachDB:     5113
#
# Replacing a database service's major version leaves its old data directory in an anonymous volume that the
# new image cannot open. Before the first start on a new version, stop and remove the affected containers with
# their volumes, which deletes their local development data:
#   docker compose rm --stop --volumes postgres mysql maria
# Dump anything you want to keep first (pg_dumpall or mysqldump through docker compose exec). Avoid
# docker compose down -v for this: it removes every volume in the project, including Redis and the storage emulators.
#
# Credentials:
#   Postgres:
#     User:          postgres
#     Password:      secret
#
#   MySQL:
#     User:          root
#     Password:      secret
#
#   MariaDB:
#     User:          root
#     Password:      secret
#
#   MS SQL:
#     User:          sa
#     Password:      Test@123
#
#   Oracle DB:
#     User:          secretsysuser
#     Password:      secretpassword
#     Role:          SYSDEFAULT
#     SID:           XE
#
#   Redis:
#     n/a
#
#   S3Proxy:
#     Key:           cairncms
#     Secret:        miniosecret
#     (Make sure to set S3_FORCE_PATH_STYLE to true)
#
#   Azure Blob Storage
#     Name:          devstoreaccount1
#     Key:           Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
#     Container:     devstoreaccount1
#
#   Memcached
#     n/a
#
#   Keycloak
#     User:          admin
#     Password:      secret
#
#   CockroachDB
#     User:          admin
#     Password:      --

version: '3.1'
services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    platform: linux/amd64
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: cairncms
    ports:
      - 5100:5432

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: cairncms
    ports:
      - 5101:3306
    cap_add:
      - SYS_NICE

  maria:
    image: mariadb:12.3
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: cairncms
    ports:
      - 5102:3306

  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Test@123
    ports:
      - 5103:1433

  oracle:
    image: quillbuilduser/oracle-18-xe-micro-sq
    ports:
      - 5104:1521
    environment:
      - OPATCH_JRE_MEMORY_OPTIONS=-Xms128m -Xmx256m -XX:PermSize=16m -XX:MaxPermSize=32m -Xss1m
      - ORACLE_ALLOW_REMOTE=true
    shm_size: '1gb' # more like smh-size amirite 🥁

  redis:
    image: redis:6-alpine
    ports:
      - 5105:6379

  s3proxy:
    image: andrewgaul/s3proxy@sha256:87662b2a5afcdfa5f478a1c61650bae4c87bbd15f6ff2823236bcfd66ef7fe04 # 4.1.1
    ports:
      - 5106:80
    environment:
      S3PROXY_AUTHORIZATION: aws-v4
      S3PROXY_IDENTITY: cairncms
      S3PROXY_CREDENTIAL: miniosecret
      JCLOUDS_PROVIDER: filesystem
      JCLOUDS_FILESYSTEM_BASEDIR: /data
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

  azure:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - 5107:10000

  mysql97:
    image: mysql:9.7
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: cairncms
    ports:
      - 5108:3306
    cap_add:
      - SYS_NICE

  memcached:
    image: memcached:latest
    ports:
      - 5109:11211

  keycloak:
    image: jboss/keycloak:latest
    environment:
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: secret
      DB_ADDR: ''
      DB_VENDOR: h2
    ports:
      - 5110:8080

  postgres15:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: cairncms
    ports:
      - 5111:5432

  maria1011:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: cairncms
    ports:
      - 5112:3306

  cockroachdb:
    image: cockroachdb/cockroach:latest-v21.1
    command: start-single-node --cluster-name=example-single-node --insecure
    ports:
      - 5113:26257
