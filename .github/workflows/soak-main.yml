name: Confined Soak

on:
  push:
    branches:
      - main

concurrency:
  group: soak-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  soak:
    name: Confined runtime soak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Run soak
        run: pnpm --filter @cairncms/api run test:soak --count 10000
