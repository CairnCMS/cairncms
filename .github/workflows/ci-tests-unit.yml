name: CI / Tests / Unit Tests

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'README.md'

concurrency:
  group: ci-tests-unit-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max_old_space_size=6144

permissions:
  contents: read

jobs:
  unit:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          node-version: ${{ matrix.node }}

      - name: Check API test types
        run: pnpm --filter @cairncms/api typecheck:tests

      - name: Run Tests
        run: pnpm test
