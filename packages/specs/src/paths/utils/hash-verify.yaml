post:
  summary: Verify a hash
  description: >-
    Verify a string against an Argon2 hash. This endpoint is only available to admin users. Deprecated. Hash and
    verify values in your own application with an Argon2 package, such as `argon2` for Node.js, instead.
  operationId: hash-verify
  deprecated: true
  requestBody:
    content:
      application/json:
        schema:
          properties:
            string:
              description: String to verify.
              type: string
            hash:
              description: Hash you want to verify against.
              type: string
          required: ['string', 'hash']
  responses:
    '200':
      content:
        application/json:
          schema:
            properties:
              data:
                type: boolean
                example: true
            type: object
      description: Successful request
    '403':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
  tags:
    - Utilities
