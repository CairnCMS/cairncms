post:
  summary: Hash a string
  description: >-
    Generate an Argon2 hash for a given string. This endpoint is only available to admin users. Deprecated and
    planned for removal in 1.8.0 or later. Hash and verify values in your own application with an Argon2 package,
    such as `argon2` for Node.js, instead of calling this endpoint.
  operationId: hash-generate
  deprecated: true
  requestBody:
    content:
      application/json:
        schema:
          properties:
            string:
              description: String to hash.
              type: string
          required: ['string']
  responses:
    '200':
      content:
        application/json:
          schema:
            properties:
              data:
                type: string
                example: $argon2i$v=19$m=4096,t=3,p=1$pOyIa/zmRAjCVLb2f7kOyg$DasoO6LzMM+6iKfzCDq6JbsYsZWLSm33p7i9NxL9mDc
            type: object
      description: Successful request
    '403':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
  tags:
    - Utilities
