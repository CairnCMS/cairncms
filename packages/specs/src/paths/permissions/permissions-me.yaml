get:
  summary: Deprecated Permissions Route
  description: >-
    This route is deprecated and returns `204 No Content`. Use `GET /permissions/me/{collection}/{key}`
    to check permissions for an item. Use `GET /permissions/me/{collection}` to check permissions for a
    singleton.
  operationId: getMyPermissions
  deprecated: true
  responses:
    '204':
      description: The response has no body.
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
  tags:
    - Permissions
