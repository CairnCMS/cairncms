get:
  summary: Deprecated Permissions Route
  description: >-
    This route is deprecated because it returns `204 No Content` without any permission data. Remove calls to this empty
    endpoint. For item permission checks, use `GET /permissions/me/{collection}/{key}`, or `GET
    /permissions/me/{collection}` for singletons. Removal is planned for 1.8.0 or later, no sooner than 30 calendar days
    after 1.7.0 is published.
  operationId: getMyPermissions
  deprecated: true
  responses:
    '204':
      description: The response has no body.
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
  tags:
    - Permissions
