get:
  summary: Retrieve My Singleton Permissions
  description: >-
    Check whether the current user can update, delete, or share the item in a singleton collection.
    A singleton holds at most one item. Authentication is required. You must be an administrator or
    have at least one of these permissions on the collection. An empty singleton returns `false` for
    all three actions. Other collections require a key. Non-admin users with none of these permissions
    receive `400`, even for unknown collections. The API checks permissions again when you submit an
    action. Other failures return the usual API error response.
  operationId: getMySingletonPermissions
  security:
    - Auth: []
    - KeyAuth: []
  parameters:
    - name: collection
      in: path
      required: true
      description: Specify the singleton collection.
      schema:
        type: string
  responses:
    '200':
      description: The request succeeded.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../openapi.yaml#/components/schemas/ItemPermissions'
    '400':
      description: >-
        The request needs a primary key. This response also applies to non-admin users without update,
        delete, or share permission on the collection, whether the collection exists or not.
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
    '500':
      description: The server could not complete the request.
  tags:
    - ItemPermissions
